openapi: 3.2.0
info:
  title: MagicBell Sendgrid API
  description: OpenAPI 3.1.0 Specification for MagicBell API.
  contact:
    name: MagicBell
    url: https://wwww.magicbell.com
  version: 2.0.0
servers:
- url: https://api.magicbell.com/v2
  description: MagicBell API (v2) Base URL
tags:
- name: sendgrid
paths:
  /integrations/sendgrid:
    summary: SendGrid email
    description: Configure SendGrid credentials so MagicBell can fan out transactional emails with your templates and domain.
    get:
      tags:
      - sendgrid
      summary: List all SendGrid integrations
      description: Retrieves the current SendGrid integration configurations for a specific integration type in the project. Returns configuration details and status information.
      operationId: list_sendgrid_integrations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendgridConfigCollection'
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: email
        displayName: SendGrid
        name: sendgrid
    put:
      tags:
      - sendgrid
      summary: Save a SendGrid integration
      description: Updates or creates the SendGrid integration for the project.
      operationId: save_sendgrid_integration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendgridConfigPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendgridConfigPayload'
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: email
        displayName: SendGrid
        name: sendgrid
    delete:
      tags:
      - sendgrid
      summary: Delete a SendGrid integration
      description: Deletes the SendGrid integration configuration from the project. This will disable the integration's functionality within the project.
      operationId: delete_sendgrid_integration
      parameters:
      - name: id
        in: query
        description: the unique identifier of the integration to be deleted
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: email
        displayName: SendGrid
        name: sendgrid
components:
  schemas:
    SendgridConfig:
      properties:
        config:
          $ref: '#/components/schemas/SendgridConfigPayload'
        id:
          type: string
        name:
          type: string
      required:
      - name
      - id
      - config
      type: object
    SendgridConfigPayload:
      $schema: http://json-schema.org/draft-07/schema#
      examples:
      - api_key: SG.1234567890
        from:
          email: company@example.com
          name: Company Name
        reply_to:
          email: reply-to@example.com
          name: Reply to Company
      properties:
        api_key:
          description: The API key for Sendgrid
          type: string
        from:
          properties:
            email:
              description: The email address to send from
              format: email
              type: string
            name:
              description: The name to send from
              type:
              - string
              - 'null'
          required:
          - email
          type: object
        reply_to:
          properties:
            email:
              description: The email address to reply to
              format: email
              type: string
            name:
              description: The name to reply to
              type:
              - string
              - 'null'
          required:
          - email
          type: object
      required:
      - api_key
      type: object
    Links:
      properties:
        first:
          type: string
        next:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
      type: object
    SendgridConfigCollection:
      examples:
      - data:
        - config:
            api_key: SG.1234567890
            from:
              email: company@example.com
              name: Company Name
            reply_to:
              email: reply-to@example.com
              name: Reply to Company
          id: '123'
          name: <provider-name>
        links:
          first: https://api.magicbell.com/v1/example
          next: https://api.magicbell.com/v1/example?page_next=abc
          prev: null
      properties:
        data:
          items:
            $ref: '#/components/schemas/SendgridConfig'
          type: array
        links:
          $ref: '#/components/schemas/Links'
      type: object
