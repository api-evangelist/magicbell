openapi: 3.2.0
info:
  title: MagicBell Integrations API
  description: OpenAPI 3.1.0 Specification for MagicBell API.
  contact:
    name: MagicBell
    url: https://wwww.magicbell.com
  version: 2.0.0
servers:
- url: https://api.magicbell.com/v2
  description: MagicBell API (v2) Base URL
tags:
- name: Integrations
paths:
  /integrations:
    summary: Integration catalog
    description: 'Integrations connect MagicBell to external providers for delivery, data ingestion, and automation. Use these grouped APIs to configure providers, run installation flows, and receive incoming events.


      Related guides: [Integration Primitive](https://www.magicbell.com/docs/primitive/integration)'
    get:
      summary: List all integrations
      description: Lists all available and configured integrations for the project. Returns a summary of each integration including its type, status, and basic configuration information.
      operationId: list_integrations
      parameters:
      - name: limit
        in: query
        description: 'defines the maximum number of items to return per page (default: 50)'
        required: false
        schema:
          type: integer
      - name: starting_after
        in: query
        description: a cursor for use in pagination, points to the last ID in previous page
        required: false
        schema:
          type: string
      - name: ending_before
        in: query
        description: a cursor for use in pagination, points to the first ID in next page
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigCollection'
      x-magicbell-auth-jwt-type: project
      tags:
      - Integrations
components:
  schemas:
    IntegrationConfigPayload:
      type: object
    IntegrationConfig:
      properties:
        config:
          $ref: '#/components/schemas/IntegrationConfigPayload'
        id:
          type: string
        name:
          type: string
      required:
      - name
      - id
      - config
      type: object
    Links:
      properties:
        first:
          type: string
        next:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
      type: object
    IntegrationConfigCollection:
      examples:
      - data:
        - config:
            webhook_url: https://example.com/webhook
          id: '123'
          name: <provider-name>
        links:
          first: https://api.magicbell.com/v1/example
          next: https://api.magicbell.com/v1/example?page_next=abc
          prev: null
      properties:
        data:
          items:
            $ref: '#/components/schemas/IntegrationConfig'
          type: array
        links:
          $ref: '#/components/schemas/Links'
      type: object
x-provenance:
