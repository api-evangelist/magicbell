          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APNSTokenCollection'
      x-magicbell-auth-jwt-type: project
  /users/{user_id}/channels/mobile_push/apns/tokens/{token_id}:
    summary: APNs token
    description: Scoped APIs for APNs (`apns`).
    get:
      tags:
      - mobile_push
      summary: Fetch a user's APNs token
      description: Fetches a specific APNs token by its ID for a given user. This endpoint is available to project administrators and requires project-level authentication. Use this to inspect token details including its status, creation date, and associated metadata.
      operationId: fetch_user_apns_token
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: token_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APNSToken'
      x-magicbell-auth-jwt-type: project
    delete:
      tags:
      - mobile_push
      summary: Delete an user's APNs token
      description: Deletes a specific user's APNs token. This endpoint is available to project administrators and permanently invalidates the specified token. Once revoked, the token can no longer be used to access channel features. This action cannot be undone.
      operationId: delete_user_apns_token
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: token_id
