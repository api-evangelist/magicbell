  /users/{user_id}/channels/mobile_push/apns/tokens:
    summary: APNs token
    description: Scoped APIs for APNs (`apns`).
    get:
      tags:
      - mobile_push
      summary: List an user's APNs tokens
      description: Lists all APNs tokens associated with a specific user. This endpoint is available to project administrators and returns a paginated list of tokens, including both active and revoked tokens.
      operationId: list_user_apns_tokens
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: 'defines the maximum number of items to return per page (default: 50)'
