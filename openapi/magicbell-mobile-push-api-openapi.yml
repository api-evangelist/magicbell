components:
  schemas:
    APNSTokenCollection:
      examples:
      - data:
        - created_at: '2021-01-01T00:00:00Z'
          device_token: eH0fLhuiRj2Np7UQ-opXAm:APA91bGtC-wH4sgW1jWkMKIZf7FYkm_RTQb7Jid7DfSJnCgivGYoRzhLrGxpcIF6yPjmbzAr6CKF-6phZkBasFUUfZmfdgcqfA_ZlZdVk6pSnon3LGzMumCzEJE0zgWoo_RUmVUVJUAt
          discarded_at: '2021-01-01T00:00:00Z'
          id: '123'
          installation_id: development
          updated_at: '2021-01-01T00:00:00Z'
        links:
          first: https://api.magicbell.com/v1/example
          next: https://api.magicbell.com/v1/example?page_next=abc
          prev: null
      properties:
        data:
          items:
            $ref: '#/components/schemas/APNSToken'
          type: array
        links:
          $ref: '#/components/schemas/Links'
      type: object
    FCMTokenCollection:
      examples:
      - data:
        - created_at: '2021-01-01T00:00:00Z'
          device_token: eH0fLhuiRj2Np7UQ-opXAm:APA91bGtC-wH4sgW1jWkMKIZf7FYkm_RTQb7Jid7DfSJnCgivGYoRzhLrGxpcIF6yPjmbzAr6CKF-6phZkBasFUUfZmfdgcqfA_ZlZdVk6pSnon3LGzMumCzEJE0zgWoo_RUmVUVJUAt
          discarded_at: '2021-01-01T00:00:00Z'
          id: '123'
          installation_id: development
          updated_at: '2021-01-01T00:00:00Z'
        links:
          first: https://api.magicbell.com/v1/example
          next: https://api.magicbell.com/v1/example?page_next=abc
          prev: null
      properties:
        data:
          items:
            $ref: '#/components/schemas/FCMToken'
          type: array
        links:
          $ref: '#/components/schemas/Links'
      type: object
    Links:
      properties:
        first:
          type: string
        next:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
      type: object
    ExpoTokenCollection:
      examples:
      - data:
        - created_at: '2021-01-01T00:00:00Z'
          device_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
          discarded_at: '2021-01-01T00:00:00Z'
          id: '123'
          updated_at: '2021-01-01T00:00:00Z'
        links:
          first: https://api.magicbell.com/v1/example
          next: https://api.magicbell.com/v1/example?page_next=abc
          prev: null
      properties:
        data:
          items:
            $ref: '#/components/schemas/ExpoToken'
          type: array
        links:
          $ref: '#/components/schemas/Links'
      type: object
    DiscardResult:
      examples:
      - discarded_at: '2021-01-01T00:00:00Z'
        id: '123'
      properties:
        discarded_at:
          description: The timestamp when the token was discarded.
          type: string
        id:
          description: The unique identifier for the discarded token.
          type: string
      type: object
    FCMTokenPayload:
      $schema: http://json-schema.org/draft-07/schema#
      examples:
      - device_token: eH0fLhuiRj2Np7UQ-opXAm:APA91bGtC-wH4sgW1jWkMKIZf7FYkm_RTQb7Jid7DfSJnCgivGYoRzhLrGxpcIF6yPjmbzAr6CKF-6phZkBasFUUfZmfdgcqfA_ZlZdVk6pSnon3LGzMumCzEJE0zgWoo_RUmVUVJUAt
        installation_id: development
      properties:
        device_token:
          description: The Firebase Cloud Messaging device registration token to associate with the user.
          minLength: 64
          type: string
      required:
      - device_token
      type: object
    ExpoToken:
      examples:
      - created_at: '2021-01-01T00:00:00Z'
        device_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        discarded_at: '2021-01-01T00:00:00Z'
        id: '123'
        updated_at: '2021-01-01T00:00:00Z'
      properties:
        created_at:
          description: The timestamp when the token was created.
          format: date-time
          type: string
        device_token:
          description: The Expo push token returned by the Expo client.
          minLength: 1
          type: string
        discarded_at:
          description: The timestamp when the token was discarded, if applicable.
          format: date-time
          type:
          - string
          - 'null'
        id:
          description: The unique identifier for the token.
          type: string
        updated_at:
          description: The timestamp when the token metadata last changed.
          format: date-time
          type:
          - string
          - 'null'
      required:
      - created_at
      - device_token
      - id
      type: object
    ExpoTokenPayload:
      $schema: http://json-schema.org/draft-07/schema#
      examples:
      - device_token: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
      properties:
        device_token:
          description: The Expo push token returned by the Expo client.
          minLength: 1
          type: string
      required:
      - device_token
      type: object
    APNSToken:
      examples:
      - created_at: '2021-01-01T00:00:00Z'
        device_token: eH0fLhuiRj2Np7UQ-opXAm:APA91bGtC-wH4sgW1jWkMKIZf7FYkm_RTQb7Jid7DfSJnCgivGYoRzhLrGxpcIF6yPjmbzAr6CKF-6phZkBasFUUfZmfdgcqfA_ZlZdVk6pSnon3LGzMumCzEJE0zgWoo_RUmVUVJUAt
        discarded_at: '2021-01-01T00:00:00Z'
        id: '123'
        installation_id: development
        updated_at: '2021-01-01T00:00:00Z'
      properties:
        app_id:
          description: The bundle identifier of the application registering this token. Use this to override the default identifier configured on the APNs integration.
          pattern: ^[a-zA-Z0-9]+(.[a-zA-Z0-9]+)*$
          type: string
        created_at:
          description: The timestamp when the token was created.
          format: date-time
          type: string
        device_token:
          description: The APNs device token to register with MagicBell.
          minLength: 64
          type: string
        discarded_at:
          description: The timestamp when the token was discarded, if applicable.
          format: date-time
          type:
          - string
          - 'null'
        id:
          description: The unique identifier for the token.
          type: string
        installation_id:
          description: The APNs environment this token belongs to. If omitted we assume it targets `production`.
          enum:
          - development
          - production
          type: string
        updated_at:
          description: The timestamp when the token metadata last changed.
          format: date-time
          type:
          - string
          - 'null'
      required:
      - created_at
      - device_token
      - id
      type: object
    APNSTokenPayload:
