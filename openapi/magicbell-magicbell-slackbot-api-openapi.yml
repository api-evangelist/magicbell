openapi: 3.2.0
info:
  title: Magicbell Slackbot API
  description: OpenAPI 3.1.0 Specification for MagicBell API.
  contact:
    name: MagicBell
    url: https://wwww.magicbell.com
  version: 2.0.0
servers:
- url: https://api.magicbell.com/v2
  description: MagicBell API (v2) Base URL
tags:
- name: magicbell_slackbot
paths:
  /integrations/magicbell_slackbot:
    summary: MagicBell-managed Slackbot
    description: Provision the hosted Slackbot that delivers actionable notifications into Slack without you maintaining an app. Ideal when you want a turnkey shared Slack experience.
    get:
      tags:
      - magicbell_slackbot
      summary: List all MagicBell SlackBot integrations
      description: Retrieves the current MagicBell SlackBot integration configurations for a specific integration type in the project. Returns configuration details and status information.
      operationId: list_magicbell_slackbot_integrations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackBotConfigCollection'
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: slack
        displayName: MagicBell SlackBot
        name: magicbell_slackbot
    put:
      tags:
      - magicbell_slackbot
      summary: Save a MagicBell SlackBot integration
      description: Updates or creates the MagicBell SlackBot integration for the project.
      operationId: save_magicbell_slackbot_integration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackBotConfigPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackBotConfigPayload'
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: slack
        displayName: MagicBell SlackBot
        name: magicbell_slackbot
    delete:
      tags:
      - magicbell_slackbot
      summary: Delete a MagicBell SlackBot integration
      description: Deletes the MagicBell SlackBot integration configuration from the project. This will disable the integration's functionality within the project.
      operationId: delete_magicbell_slackbot_integration
      parameters:
      - name: id
        in: query
        description: the unique identifier of the integration to be deleted
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: slack
        displayName: MagicBell SlackBot
        name: magicbell_slackbot
  /integrations/magicbell_slackbot/installations:
    summary: Installation flow
    description: High-level entry point for integrations that require multi-step authorization.
    put:
      tags:
      - magicbell_slackbot
      summary: Save a MagicBell SlackBot installation
      description: Creates a new installation of a MagicBell SlackBot integration for a user. This endpoint is used when an integration needs to be set up with user-specific credentials or configuration.
      operationId: save_magicbell_slackbot_installation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackInstallation'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackInstallation'
      x-magicbell-auth-jwt-type: user
  /integrations/magicbell_slackbot/installations/finish:
    summary: Finish installation
    description: Completes the installation handshake after the user authorizes access, persisting tokens and validating the external connection.
    post:
      tags:
      - magicbell_slackbot
      summary: Finish a MagicBell SlackBot installation
      description: Completes the installation flow for the MagicBell SlackBot integration. This endpoint is typically called after the user has completed any required authorization steps with MagicBell SlackBot.
      operationId: finish_magicbell_slackbot_installation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackFinishInstallResponse'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackInstallation'
      x-magicbell-auth-jwt-type: user
  /integrations/magicbell_slackbot/installations/start:
    summary: Start installation
    description: Begins the OAuth or credentials handshake for an integration, returning URLs or payloads needed to obtain user consent.
    post:
      tags:
      - magicbell_slackbot
      summary: Start a MagicBell SlackBot installation
      description: Initiates the installation flow for a MagicBell SlackBot integration. This is the first step in a multi-step installation process where user authorization or external service configuration may be required.
      operationId: start_magicbell_slackbot_installation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlackStartInstall'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackStartInstallResponseContent'
      x-forbid-unknown-cookie: true
      x-forbid-unknown-header: true
      x-forbid-unknown-path: true
      x-forbid-unknown-query: true
      x-magicbell-auth-jwt-type: user
components:
  schemas:
    SlackBotConfigPayload:
      examples:
      - enabled: true
      properties:
        enabled:
          type: boolean
      required:
      - enabled
      type: object
    SlackStartInstallResponseContent:
      examples:
      - app_id: app-id
        auth_url: https://slack.com/oauth/v2/authorize?client_id=app-id&scope=channels:read,chat:write
        scopes:
        - channels:read
        - chat:write
      properties:
        app_id:
          type: string
        auth_url:
          type: string
        scopes:
          items:
            type: string
          type: array
      type: object
    SlackInstallation:
      $schema: http://json-schema.org/draft-07/schema#
      examples:
      - access_token: REDACTED_SLACK_TOKEN
        app_id: A12345678
        authed_user:
          id: U12345678
          scope: identify,commands
        bot_user_id: U12345678
        enterprise_id: E12345678
        enterprise_name: Enterprise Grid, Inc.
        id: A12345678-T123
        incoming_webhook:
          channel: C12345678
          channel_id: C12345678
          configuration_url: https://teamname.slack.com/services/B12345678
          url: https://hooks.slack.com/services/REDACTED
        scope: identify,commands,bot
        team:
          id: T123
          name: Team Installing Your App
        team_id: T12345678
        team_name: Team Installing Your App
      properties:
        access_token:
          description: Bot token returned from the Slack OAuth exchange.
          type: string
        app_id:
          description: Slack app identifier for the installed app.
          type: string
        authed_user:
          properties:
            access_token:
              description: User token returned from the OAuth exchange.
              type: string
            expires_in:
              description: Seconds until the user token expires.
              type: integer
            id:
              description: Slack user ID for the installer.
              type: string
            refresh_token:
              description: Refresh token for the authed user.
              type: string
            scope:
              description: Space-delimited OAuth scopes granted to the user token.
              type: string
            token_type:
              description: Token type value provided by Slack.
              type: string
          required:
          - id
          type: object
        bot_user_id:
          description: Slack user ID of the installed bot.
          type: string
        enterprise:
          properties:
            id:
              description: Enterprise grid identifier.
              type: string
            name:
              description: Enterprise grid name.
              type: string
          required:
          - name
          - id
          type: object
        expires_in:
          description: Seconds until the bot access token expires.
          type: integer
        id:
          description: Unique identifier MagicBell assigns to the Slack installation.
          pattern: ^[A-Z0-9]+-.*$
          type: string
        incoming_webhook:
          properties:
            channel:
              description: Human readable name for the webhook channel.
              type: string
            configuration_url:
              description: URL users can visit to manage the webhook.
              type: string
            url:
              description: Webhook URL that Slack posts events to.
              type: string
          required:
          - channel
          - configuration_url
          - url
          type: object
        is_enterprise_install:
          description: Indicates whether the installation occurred on an enterprise grid.
          type: boolean
        refresh_token:
          description: Refresh token for regenerating the bot access token.
          type: string
        scope:
          description: Space-delimited OAuth scopes granted to the bot token.
          type: string
        team:
          properties:
            id:
              description: Workspace ID where the app was installed.
              type: string
            name:
              description: Workspace name where the app was installed.
              type: string
          required:
          - id
          type: object
        token_type:
          description: Type of bot token returned by Slack.
          type: string
      required:
      - access_token
      - authed_user
      - team
      - app_id
      type: object
    SlackFinishInstallResponse:
      $schema: http://json-schema.org/draft-07/schema#
      examples:
      - app_id: '12345678901'
        code: string
        redirect_url: string
      properties:
        app_id:
          description: The app ID of the Slack app that was originally configured at the project-level.
          type: string
        code:
          description: The code that was returned from the OAuth flow, and found in the query string of the redirect URL.
          type: string
        redirect_url:
          type: string
      required:
      - app_id
      - code
      type: object
    Links:
      properties:
        first:
          type: string
        next:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
      type: object
    SlackStartInstall:
      $schema: http://json-schema.org/draft-07/schema#
      additionalProperties: false
      examples:
      - app_id: '12345678901'
        auth_url: https://example.com/auth
        extra_scopes:
        - scope1
        - scope2
        redirect_url: https://example.com/redirect
      properties:
        app_id:
          description: Slack app ID that the installation flow should use.
          type: string
        auth_url:
          description: Optional override for the authorization URL returned to the client.
          type: string
        extra_scopes:
          description: Additional OAuth scopes to request during installation.
          items:
            type: string
          type: array
        redirect_url:
          description: Custom redirect URL to use after OAuth completes.
          type: string
      required:
      - app_id
      type: object
    SlackBotConfig:
      properties:
        config:
          $ref: '#/components/schemas/SlackBotConfigPayload'
        id:
          type: string
        name:
          type: string
      required:
      - name
      - id
      - config
      type: object
    SlackBotConfigCollection:
      examples:
      - data:
        - config:
            enabled: true
          id: '123'
          name: <provider-name>
        links:
          first: https://api.magicbell.com/v1/example
          next: https://api.magicbell.com/v1/example?page_next=abc
          prev: null
      properties:
        data:
          items:
            $ref: '#/components/schemas/SlackBotConfig'
          type: array
        links:
          $ref: '#/components/schemas/Links'
      type: object
