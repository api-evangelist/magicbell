openapi: 3.2.0
info:
  title: MagicBell Mailgun API
  description: OpenAPI 3.1.0 Specification for MagicBell API.
  contact:
    name: MagicBell
    url: https://wwww.magicbell.com
  version: 2.0.0
servers:
- url: https://api.magicbell.com/v2
  description: MagicBell API (v2) Base URL
tags:
- name: mailgun
paths:
  /integrations/mailgun:
    summary: Mailgun email
    description: Connect Mailgun so you can deliver notifications using your existing domains, routes, and analytics.
    get:
      tags:
      - mailgun
      summary: List all Mailgun integrations
      description: Retrieves the current Mailgun integration configurations for a specific integration type in the project. Returns configuration details and status information.
      operationId: list_mailgun_integrations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailgunConfigCollection'
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: email
        displayName: Mailgun
        name: mailgun
    put:
      tags:
      - mailgun
      summary: Save a Mailgun integration
      description: Updates or creates the Mailgun integration for the project.
      operationId: save_mailgun_integration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailgunConfigPayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailgunConfigPayload'
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: email
        displayName: Mailgun
        name: mailgun
    delete:
      tags:
      - mailgun
      summary: Delete a Mailgun integration
      description: Deletes the Mailgun integration configuration from the project. This will disable the integration's functionality within the project.
      operationId: delete_mailgun_integration
      parameters:
      - name: id
        in: query
        description: the unique identifier of the integration to be deleted
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: project
      x-meta:
        channel: email
        displayName: Mailgun
        name: mailgun
components:
  schemas:
    Links:
      properties:
        first:
          type: string
        next:
          type:
          - string
          - 'null'
        prev:
          type:
          - string
          - 'null'
      type: object
    MailgunConfigCollection:
      examples:
      - data:
        - config:
            api_key: key-3ax6xnjp29jd6fds4gc373sgvjxteol0
            domain: example.com
            from:
              email: hello@example.com
              name: Example
            region: us
          id: '123'
          name: <provider-name>
        links:
          first: https://api.magicbell.com/v1/example
          next: https://api.magicbell.com/v1/example?page_next=abc
          prev: null
      properties:
        data:
          items:
            $ref: '#/components/schemas/MailgunConfig'
          type: array
        links:
          $ref: '#/components/schemas/Links'
      type: object
    MailgunConfigPayload:
      $schema: http://json-schema.org/draft-07/schema#
      examples:
      - api_key: key-3ax6xnjp29jd6fds4gc373sgvjxteol0
        domain: example.com
        from:
          email: hello@example.com
          name: Example
        region: us
      properties:
        api_key:
          minLength: 1
          type: string
        domain:
          minLength: 1
          type: string
        from:
          properties:
            email:
              description: The email address to send from
              format: email
              type: string
            name:
              description: The name to send from
              type:
              - string
              - 'null'
          required:
          - email
          type: object
        region:
          enum:
          - us
          - eu
          type: string
      required:
      - api_key
      - region
      - domain
      type: object
    MailgunConfig:
      properties:
        config:
          $ref: '#/components/schemas/MailgunConfigPayload'
        id:
          type: string
        name:
          type: string
      required:
      - name
      - id
      - config
      type: object
