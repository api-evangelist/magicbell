      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/{notification_id}/unarchive:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    post:
      summary: Unarchive a notification
      description: Unarchives a notification.
      operationId: unarchive_notification
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/{notification_id}/unread:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    post:
      summary: Mark a notification unread
      description: Marks a notification as unread.
      operationId: mark_notification_unread
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
