openapi: 3.2.0
info:
  title: MagicBell Notifications API
  description: OpenAPI 3.1.0 Specification for MagicBell API.
  contact:
    name: MagicBell
    url: https://wwww.magicbell.com
  version: 2.0.0
servers:
- url: https://api.magicbell.com/v2
  description: MagicBell API (v2) Base URL
tags:
- name: Notifications
paths:
  /notifications:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    get:
      summary: List all notifications
      description: Lists all notifications for a user.
      operationId: list_notifications
      parameters:
      - name: limit
        in: query
        description: 'defines the maximum number of items to return per page (default: 50)'
        required: false
        schema:
          type: integer
      - name: starting_after
        in: query
        description: a cursor for use in pagination, points to the last ID in previous page
        required: false
        schema:
          type: string
      - name: ending_before
        in: query
        description: a cursor for use in pagination, points to the first ID in next page
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: filter notifications by their status, one of 'unseen' | 'unread' | 'read' | 'archived'
        required: false
        schema:
          type: string
      - name: category
        in: query
        description: filter notifications by their category
        required: false
        schema:
          type: string
      - name: topic
        in: query
        description: filter notifications by their topic
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCollection'
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/archive:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    post:
      summary: Archive all notifications
      description: Archive all notifications.
      operationId: archive_all_notifications
      parameters:
      - name: category
        in: query
        description: filter notifications by their category
        required: false
        schema:
          type: string
      - name: topic
        in: query
        description: filter notifications by their topic
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/read:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    post:
      summary: Mark all notifications read
      description: Marks all notifications as read.
      operationId: mark_all_notifications_read
      parameters:
      - name: category
        in: query
        description: filter notifications by their category
        required: false
        schema:
          type: string
      - name: topic
        in: query
        description: filter notifications by their topic
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/seen:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    post:
      summary: Mark all notifications seen
      description: Marks all unseen notifications as seen.
      operationId: mark_all_notifications_seen
      parameters:
      - name: category
        in: query
        description: filter notifications by their category
        required: false
        schema:
          type: string
      - name: topic
        in: query
        description: filter notifications by their topic
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/unread/count:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    get:
      summary: Count unread notifications
      description: Returns the count of unread notifications for a user. Supports filtering by category and topic.
      operationId: fetch_unread_notifications_count
      parameters:
      - name: category
        in: query
        description: filter notifications by their category
        required: false
        schema:
          type: string
      - name: topic
        in: query
        description: filter notifications by their topic
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/{notification_id}:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    get:
      summary: Fetch a notification
      description: Gets a notification by ID.
      operationId: fetch_notification
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/{notification_id}/archive:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    post:
      summary: Archive a notification
      description: Archive a notification.
      operationId: archive_notification
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      x-magicbell-auth-jwt-type: user
      tags:
      - Notifications
  /notifications/{notification_id}/read:
    summary: User notifications
    description: 'Notifications are the per-recipient records created from broadcasts. These endpoints let a user list, fetch, and manage the notifications that drive their inbox experience.


      Related guides: [Notification Primitive](https://www.magicbell.com/docs/primitive/notification)'
    post:
