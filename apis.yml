  name: MagicBell REST API v1
  description: >
    The legacy MagicBell REST API (v1) for notification delivery, user management, and channel configuration.
    Supports API key and user external ID based authentication. Rate limits are lower than v2 (100 req/min
    for read endpoints, 60 req/min for write endpoints). New integrations should use v2.
